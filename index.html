<!DOCTYPE html>
<html>
<head>
<title>trolled.67</title>

<style>
body{
    font-family: Arial;
    background: linear-gradient(135deg, #0f0f0f, #2b2b2b);
    color: white;
    text-align: center;
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

h1{
    font-size: 50px;
}

button{
    padding: 10px 20px;
    font-size: 18px;
    border: none;
    background: #000000;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 0 10px #FFFFFF;
    transition: 0.3s;
}

button:hover{
    background: #00cc99;
    box-shadow: 0 0 20px #00cc99;
}
</style>
    
</head>

<body>

<h1>DO NOT click me....</h1>


<button id="sneakyButton">
I WARNED YOU!
</button>

<script>
document.getElementById("sneakyButton").addEventListener("click", function() {

    // change text to processing
    this.textContent = "Processing...";

    // wait 1 second
    setTimeout(function(){

        // redirect to the famous rickroll
        window.location.href = "https://youtu.be/p8OHccFLeDQ";

    }, 1000);

});
</script>

</body>
</html>
